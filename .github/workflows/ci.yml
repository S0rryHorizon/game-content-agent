name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public file boundary
        run: |
          python - <<'PYCODE'
          import subprocess
          from pathlib import Path
          roots = {'.env.example', '.gitignore', '.python-version', 'pyproject.toml', 'uv.lock', 'README.md', '启动演示.command'}
          prefixes = ('src/', 'tests/', 'data/world/', 'data/examples/', 'data/scenarios/', '.github/workflows/')
          files = subprocess.check_output(['git', 'ls-files', '-z'], text=True).rstrip('\0').split('\0')
          forbidden = [p for p in files if not (p in roots or p.startswith(prefixes)) or Path(p).suffix in {'.db', '.sqlite', '.sqlite3', '.pem', '.key', '.pyc'}]
          assert not forbidden, forbidden
          assert 'OPENAI_API_KEY=\n' in Path('.env.example').read_text()
          print(f'Public file boundary checked: {len(files)} files')
          PYCODE
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.1
          uv sync --locked --python 3.12
      - name: Synthetic tests and static checks
        run: |
          uv run --no-sync pytest -q -m 'not live'
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
          uv run --no-sync pyright
          node tests/integration/graph_layout.test.cjs
          node tests/integration/app_races.test.cjs
